# Site Information
site_name: GIRAI Researcher's Handbook
site_description: Comprehensive guide for researchers contributing to the Global Index on Responsible Artificial Intelligence (GIRAI)
site_author: Global Center on AI Governance

# Repository (update with your actual repo URL)
repo_url: https://github.com/your-organization/girai-handbook
repo_name: GitHub
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Global Center on AI Governance

# Theme Configuration
theme:
  name: material

  font:
    text: DM Sans
  
  # Color Palette
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  
  # Features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

# Plugins
plugins:
  - search

# Markdown Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation Structure
nav:
  - Home: index.md
  - Introduction:
      - Overview: introduction/index.md
      - Purpose: introduction/purpose.md
      - Who Should Use This: introduction/who-should-use.md
      - List of Acronyms: introduction/acronyms.md
  - Key Concepts:
      - Overview: key-concepts/index.md
      - Artificial Intelligence: key-concepts/artificial-intelligence.md
      - Responsible AI: key-concepts/responsible-ai.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-organization